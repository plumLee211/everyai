name: Build Windows

# Mac에서는 Windows 설치 파일을 만들 수 없다(PyInstaller는 크로스 컴파일 불가). 그래서 windows runner에서
# PyInstaller로 앱을 빌드하고 Inno Setup으로 설치 프로그램(barrierfree-setup.exe)을 만든다.
# 수동 실행(Actions 탭 → Build Windows → Run workflow)과 v* 태그 푸시에서만 돈다. 모델 포함 빌드는 약 3GB라 PR마다 돌리지 않는다.
#
# 테스터에게 전달하는 방법: v* 태그를 푸시하거나, 수동 실행에서 release_tag를 적으면 GitHub Release에 설치 파일을 올린다.
# 설치 파일은 Release 첨부 한도(파일당 2GiB)에 맞게 setup.exe + 조각(.bin)으로 나뉜다. 모두 같은 폴더에 받아야 한다.
# release_tag를 비우면 Release 없이 3일 보관 아티팩트로만 올린다.
on:
  workflow_dispatch:
    inputs:
      skip_models:
        description: "모델 준비를 건너뛴 개발용 빌드(약 1GB, 배포 금지, Release에 올리지 않음)"
        type: boolean
        default: false
      release_tag:
        description: "Release로 올릴 태그(예: v0.1.0-test1). 비우면 아티팩트로만 올린다. 이 이름의 태그가 없으면 현재 커밋에 만든다."
        type: string
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write # Release 생성에 필요하다

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      BARRIERFREE_SKIP_MODELS: ${{ inputs.skip_models && '1' || '0' }}
      # Windows runner의 파이썬은 stdout이 cp1252라 spec·fetch_models의 한글 print가 UnicodeEncodeError로 죽는다.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Download ffmpeg (LGPL build)
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-extract
          New-Item -ItemType Directory ffmpeg | Out-Null
          $bin = (Get-ChildItem ffmpeg-extract -Directory | Select-Object -First 1).FullName
          Copy-Item "$bin\bin\ffmpeg.exe", "$bin\bin\ffprobe.exe" ffmpeg\
      - name: Cache models
        if: ${{ !inputs.skip_models }}
        uses: actions/cache@v6
        with:
          path: models
          key: models-${{ hashFiles('build/fetch_models.py', 'src/barrierfree/engines/device.py') }}
      - name: Build app (PyInstaller)
        run: pyinstaller build/barrierfree.spec --noconfirm
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco upgrade innosetup -y --no-progress
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe를 찾지 못했다." }
          # 설치 화면을 한국어로 만들 번역 파일. 설치된 버전에 없으면 공식 저장소에서 받는다.
          $ko = Join-Path $iscc.DirectoryName "Languages\Korean.isl"
          if (-not (Test-Path $ko)) {
            Invoke-WebRequest "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Korean.isl" -OutFile $ko
          }
          "ISCC=$($iscc.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          & $env:ISCC "/DAppVersion=$version" build\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC 실패(exit code $LASTEXITCODE)" }
          Get-ChildItem build\installer-out | Format-Table Name, @{n="MB";e={[int]($_.Length/1MB)}}
      - name: Silent install
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "barrierfree-installed"
          $p = Start-Process build\installer-out\barrierfree-setup.exe -Wait -PassThru `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$dir"
          if ($p.ExitCode -ne 0) { throw "설치 프로그램 실패(exit code $($p.ExitCode))" }
          if (-not (Test-Path "$dir\barrierfree.exe")) { throw "설치 폴더에 barrierfree.exe가 없다." }
          "INSTALL_DIR=$dir" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Smoke test (설치된 앱이 시작해 DB를 만드는지)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process "$env:INSTALL_DIR\barrierfree.exe" -PassThru
          Start-Sleep -Seconds 30
          $alive = -not $p.HasExited
          if ($alive) { Stop-Process $p -Force }
          $db = Get-ChildItem $env:APPDATA, $env:LOCALAPPDATA -Recurse -Filter barrierfree.db -ErrorAction SilentlyContinue | Select-Object -First 1
          Write-Host "alive=$alive db=$($db.FullName)"
          if (-not $alive) { throw "앱이 시작 직후 종료됐다(exit code $($p.ExitCode))." }
          if (-not $db) { throw "barrierfree.db가 만들어지지 않았다." }
      - name: Upload artifact
        if: ${{ github.ref_type != 'tag' && inputs.release_tag == '' }}
        uses: actions/upload-artifact@v7
        with:
          name: barrierfree-setup${{ inputs.skip_models && '-dev-nomodels' || '' }}
          path: build/installer-out/*
          retention-days: 3
      - name: Publish GitHub Release
        if: ${{ !inputs.skip_models && (github.ref_type == 'tag' || inputs.release_tag != '') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          # macOS 빌드(build-macos.yml)와 같은 Release를 공유한다. 먼저 끝난 쪽이 만들고, 다른 쪽은 파일만 올린다.
          # 본문은 두 OS 안내를 모두 담은 build/release-notes.md다.
          $flags = @()
          if ($env:GITHUB_REF_TYPE -ne "tag") { $flags += "--prerelease" }
          gh release create $env:TAG --target $env:GITHUB_SHA --title $env:TAG --notes-file build/release-notes.md @flags 2>$null
          # 이미 만들어져 있어 create가 실패해도 괜찮다. 진짜 실패는 아래 upload에서 잡힌다.
          $global:LASTEXITCODE = 0
          gh release upload $env:TAG (Get-ChildItem build\installer-out\*).FullName --clobber
          if ($LASTEXITCODE -ne 0) { throw "Release 업로드 실패(exit code $LASTEXITCODE)" }
