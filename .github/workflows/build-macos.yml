name: Build macOS

# PyInstaller는 크로스 컴파일을 못하므로 macOS runner(Apple Silicon)에서 .app을 빌드한다. build-windows.yml과 짝이다.
# 수동 실행(Actions 탭 → Build macOS → Run workflow)과 v* 태그 푸시에서만 돈다. 모델 포함 빌드는 약 3GB라 PR마다 돌리지 않는다.
#
# Apple 개발자 계정이 없어 서명·공증을 하지 않는다(PyInstaller가 arm64에서 넣는 ad-hoc 서명뿐이다).
# 받은 사람은 build/release-notes.md의 xattr 절차를 거쳐야 실행된다. Intel Mac은 지원하지 않는다.
#
# 테스터에게 전달: v* 태그 푸시, 또는 수동 실행에서 release_tag 입력 → Windows 빌드와 같은 Release에 올라간다.
# .app은 Release 첨부 한도(파일당 2GiB)를 넘어 zip을 1.9GB 조각(barrierfree-macos.zip.part-*)으로 나눠 올린다.
on:
  workflow_dispatch:
    inputs:
      skip_models:
        description: "모델 준비를 건너뛴 개발용 빌드(약 1GB, 배포 금지, Release에 올리지 않음)"
        type: boolean
        default: false
      release_tag:
        description: "Release로 올릴 태그(예: v0.1.0-test1). 비우면 아티팩트로만 올린다. 이 이름의 태그가 없으면 현재 커밋에 만든다."
        type: string
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write # Release 생성·업로드에 필요하다

jobs:
  build:
    runs-on: macos-latest # Apple Silicon(arm64)
    timeout-minutes: 120
    env:
      BARRIERFREE_SKIP_MODELS: ${{ inputs.skip_models && '1' || '0' }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Download ffmpeg (static arm64 build)
        # Homebrew의 ffmpeg는 Homebrew dylib에 의존해 다른 Mac에서 실행되지 않는다. 독립 실행되는 정적 빌드를 쓴다.
        # 이 빌드는 GPL(--enable-gpl)이다. 테스트 배포용이며 기관 배포 전에 라이선스 고지를 따로 확인한다.
        run: |
          mkdir ffmpeg
          for name in ffmpeg ffprobe; do
            curl -fsSL "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/$name.zip" -o "$name.zip"
            unzip -o -q "$name.zip" -d ffmpeg
            chmod +x "ffmpeg/$name"
          done
          ffmpeg/ffmpeg -version | head -1
          ffmpeg/ffprobe -version | head -1
      - name: Cache models
        if: ${{ !inputs.skip_models }}
        uses: actions/cache@v6
        with:
          path: models
          key: models-${{ hashFiles('build/fetch_models.py', 'src/barrierfree/engines/device.py') }}
      - name: Build app (PyInstaller)
        run: pyinstaller build/barrierfree.spec --noconfirm
      - name: Smoke test (앱이 시작해 DB를 만드는지)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          dist/barrierfree.app/Contents/MacOS/barrierfree &
          pid=$!
          sleep 30
          alive=0
          if kill -0 "$pid" 2>/dev/null; then alive=1; kill "$pid"; fi
          db=$(find "$HOME/Library" -name barrierfree.db 2>/dev/null | head -1)
          echo "alive=$alive db=$db"
          [ "$alive" = 1 ] || { echo "::error::앱이 시작 직후 종료됐다."; exit 1; }
          [ -n "$db" ] || { echo "::error::barrierfree.db가 만들어지지 않았다."; exit 1; }
      - name: Package (zip → 1.9GB 조각)
        run: |
          # ditto는 .app의 심볼릭 링크·속성을 보존한다(일반 zip은 앱을 깨뜨릴 수 있다).
          ditto -c -k --sequesterRsrc --keepParent dist/barrierfree.app barrierfree-macos.zip
          mkdir mac-out
          split -b 1900m -a 2 barrierfree-macos.zip mac-out/barrierfree-macos.zip.part-
          # 조각을 합쳐 풀고 quarantine을 제거하는 스크립트를 함께 올린다(테스터가 명령 한 줄로 설치한다).
          cp build/install-macos.sh mac-out/
          ls -l mac-out
      - name: Upload artifact
        if: ${{ github.ref_type != 'tag' && inputs.release_tag == '' }}
        uses: actions/upload-artifact@v7
        with:
          name: barrierfree-macos${{ inputs.skip_models && '-dev-nomodels' || '' }}
          path: mac-out/*
          retention-days: 3
      - name: Publish GitHub Release
        if: ${{ !inputs.skip_models && (github.ref_type == 'tag' || inputs.release_tag != '') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          # Windows 빌드와 같은 Release를 공유한다. 먼저 끝난 쪽이 만들고, 다른 쪽은 파일만 올린다.
          flags=""
          [ "$GITHUB_REF_TYPE" = "tag" ] || flags="--prerelease"
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file build/release-notes.md $flags || true
          gh release upload "$TAG" mac-out/* --clobber
