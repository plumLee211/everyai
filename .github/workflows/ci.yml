name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install system libraries
        # PyQt6(pytest-qt)가 libEGL 등을 요구하고, 테스트가 ffmpeg로 합성 영상을 만든다.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest
