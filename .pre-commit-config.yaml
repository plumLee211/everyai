repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff
        entry: ruff check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: gitleaks
        name: Gitleaks
        entry: gitleaks git --pre-commit --redact --staged --verbose
        language: system
        pass_filenames: false
